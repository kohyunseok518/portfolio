<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="탐색 목록 요청은 서버 메모리의 10초 보관본에서 바로 응답한다. 보관본이 만료되면 한 요청만 DB를 다시 읽고, 프로필을 고치면 커밋 뒤 보관본을 버린다"><title>탐색 목록 요청은 서버 메모리의 10초 보관본에서 바로 응답한다. 보관본이 만료되면 한 요청만 DB를 다시 읽고, 프로필을 고치면 커밋 뒤 보관본을 버린다</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#18162B"/></marker></defs><rect x="0.75" y="0.75" width="758.5" height="248.5" rx="14" fill="#F4F3FB" stroke="#D9D6EE" stroke-width="1.5"/><rect x="20" y="95" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="80.0" y="121.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">탐색 요청</text><text x="80.0" y="139.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">참가자 목록</text><rect x="185" y="80" width="190" height="90" rx="10" fill="#E7E4FD" stroke="#5B4DE8" stroke-width="1.5"/><text x="280.0" y="112.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">서버 메모리 보관본</text><text x="280.0" y="130.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">참가자 목록 10초</text><text x="280.0" y="148.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">요청마다 자기 자신만 제외</text><line x1="142" y1="125" x2="183" y2="125" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><rect x="420" y="30" width="140" height="58" rx="10" fill="#DFF3EA" stroke="#1F9D6B" stroke-width="1.5"/><text x="490.0" y="55.0" fill="#1F9D6B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">바로 응답</text><text x="490.0" y="73.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">DB·트랜잭션 없음</text><line x1="377" y1="110" x2="418" y2="65" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><text x="372" y="62" fill="#5B4DE8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="middle">보관본 있음</text><rect x="420" y="160" width="140" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="490.0" y="185.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">한 요청만 다시 읽기</text><text x="490.0" y="203.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">나머지는 결과를 기다림</text><line x1="377" y1="140" x2="418" y2="185" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><text x="384" y="192" fill="#5B4DE8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="middle">만료</text><rect x="605" y="160" width="135" height="58" rx="10" fill="#DFF3EA" stroke="#1F9D6B" stroke-width="1.5"/><text x="672.5" y="185.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">RDS MySQL</text><text x="672.5" y="203.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">참가자 + 계정 조회</text><line x1="562" y1="189" x2="603" y2="189" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><text x="380" y="240" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">프로필 수정 → 커밋 뒤(afterCommit) 보관본 폐기  ·  서버끼리는 최대 10초 어긋날 수 있음(받아들인 대가)</text></svg>