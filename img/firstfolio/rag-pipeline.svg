<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="문서를 유형별로 청킹해 MySQL에 저장하고 BM25와 FAISS로 색인한다. 퀴즈를 만들 때는 두 검색 결과를 순위로 합친 상위 5개 근거만으로 생성하고 4단계 검증을 통과한 것만 Spring으로 보낸다"><title>문서를 유형별로 청킹해 MySQL에 저장하고 BM25와 FAISS로 색인한다. 퀴즈를 만들 때는 두 검색 결과를 순위로 합친 상위 5개 근거만으로 생성하고 4단계 검증을 통과한 것만 Spring으로 보낸다</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#18162B"/></marker></defs><rect x="0.75" y="0.75" width="758.5" height="328.5" rx="14" fill="#F4F3FB" stroke="#D9D6EE" stroke-width="1.5"/><text x="20" y="30" fill="#5B4DE8" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" font-weight="600" text-anchor="start">색인</text><rect x="20" y="42" width="110" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="75.0" y="67.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">TXT 원문</text><text x="75.0" y="85.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">S3 버전 보관</text><rect x="150" y="42" width="170" height="58" rx="10" fill="#E7E4FD" stroke="#5B4DE8" stroke-width="1.5"/><text x="235.0" y="67.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">문서 유형별 청킹</text><text x="235.0" y="85.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">교과서 제목 전파·조각 병합</text><rect x="340" y="42" width="120" height="58" rx="10" fill="#DFF3EA" stroke="#1F9D6B" stroke-width="1.5"/><text x="400.0" y="67.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">MySQL</text><text x="400.0" y="85.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" text-anchor="middle">청크 831개</text><rect x="480" y="36" width="260" height="32" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="610.0" y="57.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" font-weight="600" text-anchor="middle">Kiwi 형태소 + BM25</text><rect x="480" y="74" width="260" height="32" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="610.0" y="95.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" font-weight="600" text-anchor="middle">OpenAI 임베딩 + FAISS</text><line x1="132" y1="71" x2="148" y2="71" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><line x1="322" y1="71" x2="338" y2="71" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><line x1="462" y1="62" x2="478" y2="52" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><line x1="462" y1="80" x2="478" y2="90" stroke="#18162B" stroke-width="1.6" marker-end="url(#arr)"/><text x="20" y="148" fill="#5B4DE8" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" font-weight="600" text-anchor="start">생성</text><rect x="20" y="160" width="110" height="58" rx="10" fill="#FFFFFF" stroke="#D9D6EE" stroke-width="1.5"/><text x="75.0" y="185.0" fill="#18162B" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">단원·주제</text><text x="75.0" y="203.0" fill="#5E5A78" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans